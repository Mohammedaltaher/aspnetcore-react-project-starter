services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__AutoMigrate: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=starter;Username=starter;Password=${POSTGRES_PASSWORD}"
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DataProtection__KeysPath: /app/keys
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - api_keys:/app/keys
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - api
volumes:
  postgres_data:
  api_keys:
